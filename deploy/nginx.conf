map $uri $garden_cache_control {
    default "no-cache";
    ~^/(private|account|api)(/|$) "no-store";
}
limit_req_zone $binary_remote_addr zone=garden_api:10m rate=10r/s;
server {
    listen 80;
    listen [::]:80;
    server_name ymihh.xyz www.ymihh.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://ymihh.xyz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ymihh.xyz;
    ssl_certificate /etc/letsencrypt/live/ymihh.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ymihh.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://ymihh.xyz$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ymihh.xyz;
    ssl_certificate /etc/letsencrypt/live/ymihh.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ymihh.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/garden/current/dist;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $garden_cache_control always;
    # Never log API queries or private health payloads.
    location /api/ {
        access_log off;
        limit_req zone=garden_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
        proxy_connect_timeout 3s;
    }
    location = /tools/cycle { return 302 /private/cycle/; }
    location = /tools/cycle/ { return 302 /private/cycle/; }
    location = /tools/cycle/index.html { return 302 /private/cycle/; }
    location = /private { return 302 /private/; }
    location /private/ {
        auth_request /_garden_auth;
        error_page 401 = @private_login;
        try_files $uri $uri/ =404;
    }
    location @private_login { return 302 /account/?next=$uri; }
    location = /_garden_auth {
        internal;
        proxy_pass http://127.0.0.1:8787/api/auth/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
}
